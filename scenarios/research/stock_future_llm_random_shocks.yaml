name: stock_future_llm_random_shocks
description: >
  Compact LLM-backed stock and futures market with matching market-maker,
  retail, and informed participants, a cross-market arbitrageur, and seeded
  random micro and macro shocks.
rabbitmq_host: localhost

aml_config:
  llm:
    provider: openai
    model: gpt-5.4
    api_key_env: OPENAI_API_KEY
    temperature: 0.0
    timeout_seconds: 30
    max_retries: 2
    max_output_tokens: 500
  ecology:
    enabled: true
    experiment:
      id: stock_future_llm_random_shocks
      treatment: connected_stock_future_random_shocks
      master_seed: 20260831
      replicate_id: 1
    relationships:
      - id: aapl_spot_future
        type: spot_future
        source: AAPL
        target: AAPL_FUT
        channels:
          information: true
          valuation: true
          arbitrage: true
          shared_risk: false
        parameters:
          annualized_carry_bps: 500
          expiry_days: 30
          hedge_ratio: 1.0

stocksim_config:
  exchange_mode: orderbook
  instruments: [AAPL, AAPL_FUT]

  exchanges:
    AAPL:
      data_source: synthetic
      symbol_type: stock
      asset_class: stock
      warmup_candles: 0
    AAPL_FUT:
      data_source: synthetic
      symbol_type: future
      asset_class: future
      underlying: AAPL
      contract_multiplier: 1.0
      expiry_days: 30
      warmup_candles: 0

  agents:
    stock_market_maker:
      type: AML_Market_Maker
      parameters:
        instrument_exchange_map: {AAPL: exchange_aapl}
        initial_cash: 250000
        initial_positions: {AAPL: 1200}
        initial_cost_basis: {AAPL: 100.0}
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        fair_price: 100.0
        spread: 0.20
        quote_size: 40
        quote_levels: 3
        level_spacing: 0.05
        target_inventory: 1000
        min_inventory: 100
        max_inventory: 2000

    future_market_maker:
      type: AML_Market_Maker
      parameters:
        instrument_exchange_map: {AAPL_FUT: exchange_aapl_fut}
        initial_cash: 250000
        initial_positions: {AAPL_FUT: 1200}
        initial_cost_basis: {AAPL_FUT: 100.41}
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        fair_price: 100.41
        spread: 0.20
        quote_size: 40
        quote_levels: 3
        level_spacing: 0.05
        target_inventory: 1000
        min_inventory: 100
        max_inventory: 2000

    stock_retail:
      type: AML_Retail_Trader
      parameters:
        instrument_exchange_map: {AAPL: exchange_aapl}
        initial_cash: 25000
        initial_positions: {AAPL: 20}
        initial_cost_basis: {AAPL: 100.0}
        random_seed: 1101
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        trade_probability: 0.65
        max_order_size: 8
        buy_bias: 0.50
        herding_tendency: 0.20
        panic_level: 0.15
        sentiment_sensitivity: 0.55
        shock_sensitivity: 0.65

    future_retail:
      type: AML_Retail_Trader
      parameters:
        instrument_exchange_map: {AAPL_FUT: exchange_aapl_fut}
        initial_cash: 25000
        initial_positions: {AAPL_FUT: 20}
        initial_cost_basis: {AAPL_FUT: 100.41}
        random_seed: 2101
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        trade_probability: 0.65
        max_order_size: 8
        buy_bias: 0.50
        herding_tendency: 0.20
        panic_level: 0.15
        sentiment_sensitivity: 0.55
        shock_sensitivity: 0.65

    stock_informed:
      type: AML_Informed_Trader
      parameters:
        instrument_exchange_map: {AAPL: exchange_aapl}
        initial_cash: 150000
        initial_positions: {AAPL: 50}
        initial_cost_basis: {AAPL: 100.0}
        random_seed: 3101
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        fair_value_anchor: 100.0
        information_edge: 0.75
        trade_probability: 0.45
        max_order_size: 15
        max_position: 500
        min_position: 0
        signal_threshold: 0.002
        shock_reactivity: 0.85

    future_informed:
      type: AML_Informed_Trader
      parameters:
        instrument_exchange_map: {AAPL_FUT: exchange_aapl_fut}
        initial_cash: 150000
        initial_positions: {AAPL_FUT: 50}
        initial_cost_basis: {AAPL_FUT: 100.41}
        random_seed: 3201
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        fair_value_anchor: 100.41
        information_edge: 0.75
        trade_probability: 0.45
        max_order_size: 15
        max_position: 500
        min_position: 0
        signal_threshold: 0.002
        shock_reactivity: 0.85

    basis_arbitrageur:
      type: AML_Cross_Market_Arbitrageur
      parameters:
        instrument_exchange_map:
          AAPL: exchange_aapl
          AAPL_FUT: exchange_aapl_fut
        initial_cash: 500000
        initial_positions: {AAPL: 0, AAPL_FUT: 0}
        initial_cost_basis: {AAPL: 100.0, AAPL_FUT: 100.41}
        action_interval: 30s
        slow_loop_interval: 3m
        slow_strategist: {type: openai}
        relationship_id: aapl_spot_future
        entry_threshold_bps: 10
        exit_threshold_bps: 3
        child_order_size: 10
        max_position: 200

    shock_agent:
      type: AML_Shock_Agent
      parameters:
        random_seed: 5105
        default_duration_ticks: 8
        initial_market_state:
          policy_rate_bps: 425
          liquidity_index: 1.0
          funding_spread_bps: 25
          risk_aversion: 0.0
        random_events:
          enabled: true
          probability_per_tick: 0.035
          max_events: 2
          start_tick: 12
          end_tick: 100
          templates:
            - shock_type: negative_news
              shock_class: non_systematic
              scope: micro
              state_scope: instrument
              visibility: affected
              weight: 2.0
              severity_range: [0.35, 0.75]
              direction: -1
              affected_instruments: [AAPL]
              fundamental_price_shift_per_severity: 1.2
              effects:
                order_arrival_multiplier: 1.55
                risk_limit_multiplier: 0.72
                liquidity_multiplier: 0.68
                volatility_multiplier: 1.45
                spread_multiplier: 1.30
                sentiment_shift: -0.45
              duration_ticks: 8
              state_reversion_ticks: 10
              message: Unexpected firm-specific information changes the equity outlook.
            - shock_type: unexpected_order_flow
              shock_class: non_systematic
              scope: micro
              state_scope: instrument
              visibility: public
              weight: 1.5
              severity_range: [0.25, 0.60]
              direction_choices: [-1, 1]
              affected_instruments: [AAPL]
              effects:
                order_arrival_multiplier: 1.75
                risk_limit_multiplier: 0.82
                liquidity_multiplier: 0.75
                volatility_multiplier: 1.35
                spread_multiplier: 1.22
              duration_ticks: 6
              state_reversion_ticks: 8
              message: An unexpected directional order-flow imbalance reaches the stock market.
            - shock_type: policy_rate_hike
              shock_class: systematic
              scope: macro
              state_scope: global
              visibility: public
              weight: 1.5
              severity_range: [0.40, 0.75]
              direction: -1
              affected_instruments: [AAPL, AAPL_FUT]
              market_state_delta:
                policy_rate_bps: 25
                funding_spread_bps: 12
                risk_aversion: 0.25
              effects:
                order_arrival_multiplier: 1.25
                risk_limit_multiplier: 0.78
                liquidity_multiplier: 0.80
                volatility_multiplier: 1.45
                spread_multiplier: 1.35
                price_impact_multiplier: 1.30
                sentiment_shift: -0.35
              per_instrument_effects:
                AAPL: {fundamental_price_shift: -0.60}
                AAPL_FUT: {fundamental_price_shift: -0.70}
              duration_ticks: 8
              state_reversion_ticks: 12
              message: An unexpected policy tightening raises rates and reduces market liquidity.
            - shock_type: funding_stress
              shock_class: systematic
              scope: macro
              state_scope: global
              visibility: public
              weight: 1.0
              severity_range: [0.35, 0.70]
              direction: -1
              affected_instruments: [AAPL, AAPL_FUT]
              market_state_delta:
                funding_spread_bps: 20
                risk_aversion: 0.35
              effects:
                order_arrival_multiplier: 1.35
                risk_limit_multiplier: 0.65
                liquidity_multiplier: 0.58
                volatility_multiplier: 1.55
                spread_multiplier: 1.50
                price_impact_multiplier: 1.35
              per_instrument_effects:
                AAPL: {fundamental_price_shift: -0.45}
                AAPL_FUT: {fundamental_price_shift: -0.55}
              duration_ticks: 10
              state_reversion_ticks: 12
              message: Unexpected funding stress reduces risk capacity across both markets.

  simulation:
    start_time: "2025-03-01T09:30:00+00:00"
    end_time: "2025-03-01T10:30:00+00:00"
    tick_interval: 30s
    startup_grace_seconds: 2
    max_wall_time_seconds: 3600
    expected_exchange_agent_count: 2

  environment:
    rabbitmq_host: localhost
    log_level: INFO
